name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r site/requirements.txt -r requirements-validation.txt
      - run: python3 scripts/validate_repository.py
      - run: python3 scripts/run_integrated_tests.py
      - run: python3 scripts/validate_public_release.py
      - run: mkdocs build --strict
