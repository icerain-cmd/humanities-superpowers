<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Humanities Superpowers research pipeline</title><desc id="desc">Seven research stages connected by arrows, from question to submission gate.</desc>
<style>.t{font:600 20px system-ui,sans-serif;fill:#152238}.s{font:400 14px system-ui,sans-serif;fill:#46566d}.b{fill:#f6f8fb;stroke:#8aa0bd;stroke-width:2}.g{fill:#eef8f0;stroke:#4d9560;stroke-width:2}.a{stroke:#63758d;stroke-width:3;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63758d"/></marker></defs>
<g transform="translate(25 70)"><rect class="b" rx="16" width="145" height="100"/><text class="t" x="72" y="42" text-anchor="middle">Question</text><text class="s" x="72" y="68" text-anchor="middle">problem + stakes</text></g>
<path class="a" d="M175 120 H210"/>
<g transform="translate(215 70)"><rect class="b" rx="16" width="145" height="100"/><text class="t" x="72" y="42" text-anchor="middle">Scope</text><text class="s" x="72" y="68" text-anchor="middle">claims + limits</text></g>
<path class="a" d="M365 120 H400"/>
<g transform="translate(405 70)"><rect class="b" rx="16" width="145" height="100"/><text class="t" x="72" y="42" text-anchor="middle">Sources</text><text class="s" x="72" y="68" text-anchor="middle">lineage + dialogue</text></g>
<path class="a" d="M555 120 H590"/>
<g transform="translate(595 70)"><rect class="b" rx="16" width="145" height="100"/><text class="t" x="72" y="42" text-anchor="middle">Argument</text><text class="s" x="72" y="68" text-anchor="middle">claims + evidence</text></g>
<path class="a" d="M745 120 H780"/>
<g transform="translate(785 70)"><rect class="b" rx="16" width="145" height="100"/><text class="t" x="72" y="42" text-anchor="middle">Stress test</text><text class="s" x="72" y="68" text-anchor="middle">objections + rivals</text></g>
<path class="a" d="M935 120 H970"/>
<g transform="translate(975 70)"><rect class="g" rx="16" width="200" height="100"/><text class="t" x="100" y="42" text-anchor="middle">Submission gate</text><text class="s" x="100" y="68" text-anchor="middle">citations + terms + privacy</text></g>
<text class="s" x="600" y="235" text-anchor="middle">AI supports each stage; the researcher retains interpretive and scholarly responsibility.</text>
</svg>