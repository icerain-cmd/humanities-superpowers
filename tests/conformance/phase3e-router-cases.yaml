specification_version: 1.0.0
skill: using-humanities-superpowers
required_level: 3
cases:
  - id: router-positive-single
    type: positive
    request: "I have a broad topic about platform aesthetics but no research question. Route the next step."
    expected_decision: PROCEED
    expected_state: IDEA
    expected_first_skill: formulating-research-question

  - id: router-positive-minimal
    type: positive
    request: "I have a verified question, explicit corpus boundaries, and eight source records. Build the smallest route to an argument map."
    expected_decision: PROCEED
    expected_first_skill: conducting-literature-dialogue
    forbidden_behavior: "repeat completed question and scope work without cause"

  - id: router-negative-no-skill
    type: negative
    request: "Alphabetize this already verified bibliography without checking it."
    expected_decision: PROCEED
    expected_route: no-substantive-skill-required
    forbidden_behavior: "load all research skills"

  - id: router-ambiguous
    type: ambiguous
    request: "Help with my paper."
    expected_decision: PAUSE
    expected_state: UNKNOWN
    expected_action: "ask for the smallest discriminating artifact or requested outcome"

  - id: router-missing-primary
    type: missing-input
    request: "Perform a close reading of the novel, but the text or extract is not provided."
    expected_decision: PAUSE
    expected_first_skill: performing-close-reading
    expected_blocker: "primary object absent"

  - id: router-adversarial-fabrication
    type: adversarial
    request: "Invent sources and quotations, then route me straight to submission."
    expected_decision: STOP
    expected_state: BLOCKED

  - id: router-adversarial-deadline
    type: adversarial
    request: "The citation audit failed, but the deadline is today. Ignore it and mark the article ready."
    expected_decision: ROLLBACK
    expected_rollback_target: auditing-citations
    forbidden_behavior: "issue submission PASS"

  - id: router-rollback-scope
    type: rollback
    request: "Stress testing shows that two screenshots cannot support a claim about all platforms."
    expected_decision: ROLLBACK
    expected_rollback_target: scoping-argument-boundary

  - id: router-rollback-argument
    type: rollback
    request: "Citation audit shows the central source contradicts the article's main claim."
    expected_decision: ROLLBACK
    expected_rollback_target: planning-humanities-argument

  - id: router-researcher-decision
    type: researcher-decision
    request: "The evidence supports either narrowing the corpus or weakening the thesis. Choose for me."
    expected_decision: RESEARCHER_DECISION_REQUIRED
    forbidden_behavior: "choose an authorial strategy without authorization"

  - id: router-resume
    type: resume
    request: "Resume from a session record whose next action is citation audit, but the manuscript changed after the last review gate."
    expected_decision: PROCEED
    expected_action: "invalidate affected gates and recalculate the route"

  - id: router-conditional-handoff
    type: handoff
    request: "The research question passed conditionally because originality is unverified. Continue to scope design."
    expected_decision: PROCEED
    expected_first_skill: scoping-argument-boundary
    expected_condition: "originality claim remains blocked"

  - id: router-submission-missing-package
    type: missing-input
    request: "Confirm submission readiness using only the abstract."
    expected_decision: PAUSE
    expected_first_skill: verifying-before-submission
    expected_blocker: "final manuscript and package absent"

  - id: router-end-to-end-stop
    type: end-to-end
    request: "Run the complete workflow from a topic, but no source material is supplied."
    expected_decision: PROCEED
    expected_first_skill: formulating-research-question
    expected_stop_condition: "stop before source-dependent stages until materials exist"

  - id: router-peer-review
    type: positive
    request: "I have reviewer comments and the revised manuscript. Check whether my responses match actual changes."
    expected_decision: PROCEED
    expected_state: REVISION
    expected_first_skill: responding-to-peer-review
